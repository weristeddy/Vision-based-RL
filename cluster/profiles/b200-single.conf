# B200 single-GPU training (one rank owns the whole policy update).
#
# mjlab runs one GPU in-process rather than through torchrunx, so this is the
# same code path with no launcher between it and the trainer. One rank at N
# environments performs the same update as four ranks at N/4: gradients are
# all-reduced and divided by the world size, so the samples behind each
# optimizer step are identical. It costs wall clock and saves three GPUs.
#
# --env.scene.num-envs is deliberately *not* owned here -- see cluster/train.slurm.
PARTITION="ber-gpu1"
ACCOUNT="gpu"
CPUS_PER_TASK="12"
MEMORY="128G"
TIME_LIMIT="3-00:00:00"
GPU_COUNT="1"
REQUIRE_CUDA_DEVICE_SUBSTRING="B200"
CONTAINER_IMAGE="rl.sif"

# Interactive viewer resources and laptop connection endpoint.
VIEW_CPUS_PER_TASK="8"
VIEW_MEMORY="24G"
VIEW_TIME_LIMIT="01:00:00"
COMPUTE_HOST_SUFFIX="${VBRL_COMPUTE_HOST_SUFFIX:-.fe.hhi.de}"
SSH_USER="${VBRL_SSH_USER:-${USER:-}}"
LOGIN_HOST="${VBRL_LOGIN_HOST:-wn-headnode.fe.hhi.de}"
