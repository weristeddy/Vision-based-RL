# Short validation jobs. Use --fallback only when the local testing partition
# cannot provide the unchanged four-GPU topology.
PARTITION="testing"
ACCOUNT=""
FALLBACK_PARTITION="ber-testing"
FALLBACK_ACCOUNT="gpu"
CPUS_PER_TASK="32"
MEMORY="256G"
TIME_LIMIT="00:30:00"
GPU_COUNT="4"
REQUIRE_CUDA_DEVICE_SUBSTRING=""
CONTAINER_IMAGE="rl.sif"

# Scene/policy viewing uses one GPU from the same selected partition.
VIEW_CPUS_PER_TASK="8"
VIEW_MEMORY="24G"
VIEW_TIME_LIMIT="01:00:00"
COMPUTE_HOST_SUFFIX="${VBRL_COMPUTE_HOST_SUFFIX:-.fe.hhi.de}"
SSH_USER="${VBRL_SSH_USER:-${USER:-}}"
LOGIN_HOST="${VBRL_LOGIN_HOST:-wn-headnode.fe.hhi.de}"
