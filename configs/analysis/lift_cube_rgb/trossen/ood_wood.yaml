# Same policy and capture protocol as default.yaml, but with the out-of-
# distribution wood tabletop swapped in. Pairs with ood_comparison.yaml.
version: 1
task_id: Mjlab-LiftCube-CollisionCam-DinoV2ViTS14-LocalGrid7-Trossen
checkpoint_file: ckpts/lift_cube/dinov2_vits14_local_grid7_real.pt
output: artifacts/analysis/lift_cube_rgb/trossen
scene: wood
steps:
  - script: capture
    args:
      output: capture__wood.npz
      num_frames: 4096
      seed: 20000
      targets: [cube_position, goal_position]
  - script: features
    args:
      capture: capture__wood.npz
      output: features__wood.npz
      stages: [backbone, adapter]
