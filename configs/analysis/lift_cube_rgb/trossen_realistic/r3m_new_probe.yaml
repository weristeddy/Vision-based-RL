# Can this encoder's frozen features locate the cube? The encoder is frozen, so
# the backbone stage does not depend on which checkpoint is loaded -- the same
# retained checkpoint is used on both cameras so only the images differ.
version: 1
task_id: Mjlab-LiftCube-Sim2Real-R3MResNet50-SpatialSoftmax-TrossenRealistic
checkpoint_file: ckpts/lift_cube/r3m_resnet50_spatial_softmax_real.pt
output: artifacts/analysis/lift_cube_probe/r3m_new
steps:
  - script: capture
    args:
      output: capture.npz
      num_frames: 1024
      seed: 20000
      targets: [cube_position]
  - script: features
    args:
      capture: capture.npz
      output: features.npz
      stages: [backbone, adapter]
  - script: probe
    args:
      capture: capture.npz
      features: features.npz
      output: probes/{stage}__{target}.npz
      stages: [backbone, adapter]
      targets: [cube_position]
