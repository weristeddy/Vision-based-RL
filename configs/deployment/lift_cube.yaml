version: 1

# The task ID fixes the architecture, observations, camera, and action scaling,
# exactly as it does for training and evaluation.
task_id: Mjlab-LiftCube-Sim2Real-DinoV2ViTS14-SpatialSoftmax-TrossenRealistic
checkpoint_file: ckpts/lift_cube/dinov2_vits14_spatial_softmax_sim2real.pt

arm_ip: 192.168.1.2
arm_model: wxai_v0
motor_parameters: wxai_v0_20260317   # pin it: the driver default moved in 1.10.0

# Where to lift the cube to, in the robot's base frame (metres). The training
# command sampled this uniformly from x(0.3, 0.5), y(-0.2, 0.2), z(0.2, 0.4);
# a target outside that box is refused as out of distribution. This default is
# the centre of it. The cube's own position is never configured -- the policy
# sees it only through the camera.
# Put x, y directly above where the cube actually sits, and keep z well above
# the gripper's height at the home pose. Forward kinematics puts the end
# effector at z = 0.205 there, so a goal at z = 0.2 reads as "already at
# target" and the policy has no reason to lift at all; 0.35 asks for a clear
# 15 cm rise. Valid: x (0.3, 0.5), y (-0.2, 0.2), z (0.2, 0.4).
goal: [0.35, 0.0, 0.35]

control_hz: 50.0
device: cuda:0
camera_serial: null
camera_fps: 60   # one fresh frame per 50 Hz control cycle

safety:
  max_joint_step: 0.035          # 1.75 rad/s backstop; training requested ~3.5 rad/s
  max_gripper_step: 0.005
  startup_seconds: 3.0
  command_goal_time: 0.0         # setpoint streaming; 0.02 was measured to jitter
  action_smoothing: 0.25         # EMA on the policy output; lower = smoother and slower
  max_action_magnitude: 8.0      # sim peaked at 3.5; hardware hit 18.95
