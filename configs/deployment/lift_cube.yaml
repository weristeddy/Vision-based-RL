version: 1

# vbrl-deploy configs/deployment/lift_cube.yaml --policy <name> --goal <n>
# python -m vbrl.deployment.collect configs/deployment/lift_cube.yaml --goal <n>
task: lift_cube
camera: wrist
steps: 400      # the training episode, 20 s at 20 Hz
runs: 5

# Lift targets in the base frame, never measured. Valid: x (0.3, 0.5), y (-0.2, 0.2),
# z (0.2, 0.4); z stays above the gripper's height at home (0.205).
goals:
  - [0.35, 0.00, 0.30]
  - [0.45, 0.12, 0.25]
  - [0.40, -0.12, 0.35]

# Run order inside each run; the best seed of each, from
# python -m vbrl.deployment.fetch_policies configs/deployment/lift_cube.yaml.
policies:
  DinoV2ViTS14-AfaFull6: ckpts/deployment/lift_cube/DinoV2ViTS14-AfaFull6.onnx
  DinoV2ViTS14-Global: ckpts/deployment/lift_cube/DinoV2ViTS14-Global.onnx
  R3MResNet50-AfaFull32: ckpts/deployment/lift_cube/R3MResNet50-AfaFull32.onnx
  R3MResNet50-Global: ckpts/deployment/lift_cube/R3MResNet50-Global.onnx
  NatureCnn-FlattenRelu: ckpts/deployment/lift_cube/NatureCnn-FlattenRelu.onnx
  CompactVit-Svea: ckpts/deployment/lift_cube/CompactVit-Svea.onnx

goal_space: lift_xyz
control_hz: 20.0
command_goal_time_s: 0.05
motion:
  action_smoothing: 1.0
  max_joint_step: null
  max_gripper_step: 0.01
  max_arm_action: 6.0
  home_seconds: 3.0
