version: 1

# The exported policy. Its metadata carries the joint order, the default pose,
# the observation term order and the action scale, so no task ID is needed here.
#
# Under ckpts/ beside the .pt it came from, not artifacts/: it is the deployable
# form of a checkpoint rather than an analysis output. Re-export any iteration
# with vbrl-export-onnx; this one is the last of W&B run ntl27zt9.
onnx_file: ckpts/lift_cube/dinov2_vits14_spatial_softmax_sim2real_5998.onnx

arm_ip: 192.168.1.2

# Where to lift the cube to, in the robot's base frame. Put x, y above where the
# cube sits and keep z clear of the gripper's height at home (z = 0.205), or the
# policy reads "already there" and never lifts. Valid: x (0.3, 0.5),
# y (-0.2, 0.2), z (0.2, 0.4). The cube's own position is never configured --
# the policy sees it only through the camera.
goal: [0.35, 0.0, 0.35]

control_hz: 50.0        # the training decimation: 0.005 s x 4

motion:
  action_smoothing: 0.25   # lower = smoother and slower; 1.0 = raw policy output
  max_joint_step: 0.035    # x control_hz = 1.75 rad/s speed limit
  max_gripper_step: 0.005
  max_arm_action: 6.0            # the 6 arm channels; the gripper legitimately saturates
  home_seconds: 3.0
