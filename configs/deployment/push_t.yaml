version: 1

# The exported policy. Its metadata carries the joint order, the default pose,
# the observation term order and the action scale, so no task ID is needed here.
#
# Under ckpts/ beside the .pt it came from, not artifacts/: it is the deployable
# form of a checkpoint rather than an analysis output. Re-export any iteration
# with vbrl-export-onnx; this one is the last of W&B run yhhr77ar --
# Mjlab-PushT-VisualSlow-DinoV2ViTS14-Afa6-TrossenRealistic, 6,000 iterations at
# gamma 0.996, carrying the object-table press penalty.
onnx_file: ckpts/push_t/dinov2_vits14_afa6_visualslow_press_5999.onnx

arm_ip: 192.168.1.2

# Where the T should end up, as a pose on the table rather than a point above
# it: (x, y, yaw) in the robot's base frame, heading in radians. `target_pose`
# also carries a z, but it never varies -- the command puts the target at the
# T's mid-height, 7 mm in the base frame -- so it is not configured here.
#
# This is a *measurement*, not a free choice, because the policy sees the goal
# twice: as these numbers, and as the marker drawn on the table in its camera
# image. They have to agree. Solve it with
#
#   python -m vbrl.deployment.goal_pose <frame.png> --margin-mm 7.0
#
# from one external-camera frame with the two tag25h9 markers seated in the
# marker's notches, then take the tags off -- the policy must never see them.
#
# These came from artifacts/deployment/apriltags/goal4_1280x720.png. The solve
# was checked by reprojecting the marker outline back onto the frame, and it
# agrees to 0.35 mm with the same scene solved before the tag ids were put the
# right way round -- id 0 belongs in the LEFT notch, and swapping them puts the
# yaw 180 deg out with everything else looking correct.
#
# yaw +0.71 deg, the easy end of the task: measured in sim at this goal, the
# policy succeeds 0.648 of the time here against 0.305 at 90 deg and 0.281 at
# -150 deg, which is where the earlier attempts were aimed.
goal_space: push_t_xy_yaw
goal: [0.38442, 0.01567, 0.0124]

# Fixed colour exposure. Auto clipped 42% of the pixels the policy saw on the
# first logged run -- the tabletop was a flat white field where every one of the
# 1203 training tables carried texture -- and auto is frame-rate dependent here,
# metering the same scene to 29% clipped at 15 fps and 0% at 5 fps.
#
# 7000 us is set against the training distribution: sim frames sit at median 150
# (141-170) and mean 141, and this camera measures median 158, mean 130, 0%
# clipped, with clipping starting between 8000 and 11000.
#
# Re-probe after any lighting change: python -m vbrl.deployment.camera
camera_exposure_us: 7000

control_hz: 50.0        # the training decimation: 0.005 s x 4

motion:
  # No shaping of the policy's output at all, because the trace says there is
  # nothing to shape. Run1 and run2 both measured this arm closing 0.240 of the
  # commanded gap per step against sim's 0.267 -- the plants match, and the
  # premise behind `response_gain` (that a real servo reaches its setpoint while
  # sim's lags) was simply wrong.
  #
  # What the clamp was doing instead: at 0.010 it fired on 100% of steps, cut a
  # mean 0.043 rad off every command, and held the arm at 0.284 rad/s against
  # sim's 0.50. It was not limiting excursions, it was the binding constraint
  # throughout, which is why the placement failed while transport looked fine.
  action_smoothing: 1.0
  response_gain: 1.0
  max_joint_step: 0.008
  max_gripper_step: 0.01   # unused: Push-T drives joint_0..5 only
  max_arm_action: 6.0
  home_seconds: 3.0
