version: 1

# W&B run z9l3hckq -- Mjlab-PushT-PixelGoal-DinoV2ViTS14-Afa6-TrossenRealistic,
# 6,000 iterations at gamma 0.996. Same environment as the VisualSlow policy in
# push_t.yaml except that `target_pose` was removed from the actor (it stays in
# the critic) and the action scale was halved, so the goal has to be read out of
# the camera image and the arm is already slow at raw output.
#
# Its sim numbers at the end of training, against 0.501 for the VisualSlow
# policy this replaces, both at the full yaw range: success 0.116, overlap
# 0.475, position error 32 mm, yaw error 0.90 rad. It did not learn to locate
# the goal from pixels. Deploy it to see what that looks like on hardware, not
# expecting a placement.
onnx_file: ckpts/push_t/dinov2_vits14_afa6_pixelgoal_5999.onnx

arm_ip: 192.168.1.2

# Read by nothing in the policy. This graph's observation terms are
# joint_pos, joint_vel, actions -- 22 numbers, no target_pose -- so the only
# place the goal reaches it is the marker drawn on the table in its camera
# image. The field stays because the manifest schema range-checks it and the
# trace logs it, and it holds the pose the marker is physically at, solved from
# artifacts/deployment/apriltags/goal4_1280x720.png with
#
#   python -m vbrl.deployment.goal_pose <frame.png> --margin-mm 7.0
#
# Move the marker and this should be re-solved to match, so the log says where
# the goal was. Unlike push_t.yaml there is no consistency requirement between
# the number and the marker, because only the marker is an input.
goal_space: push_t_xy_yaw
goal: [0.38442, 0.01567, 0.0124]

# Fixed colour exposure, set against the training distribution: sim frames sit
# at median 150 and mean 141, and this camera measures median 158, mean 130, 0%
# clipped at 7000 us, with clipping starting between 8000 and 11000. Auto
# clipped 42% of the pixels the policy saw on the first logged run.
#
# Re-probe after any lighting change: python -m vbrl.deployment.camera
camera_exposure_us: 7000

control_hz: 50.0        # the training decimation: 0.005 s x 4

motion:
  # Nothing at all. This is the point of the run: the policy was trained with
  # scale 0.05 and clip +/-0.05 rather than 0.1, and both travel with the graph
  # in its ONNX metadata, so the 0.05 rad/step bound is applied by the same
  # numbers training used. Shaping it here would only re-introduce what the
  # traces already blamed -- at 0.010 the rate clamp fired on 100% of steps,
  # cut a mean 0.043 rad off every command and held the arm at 0.284 rad/s
  # against sim's 0.50, binding throughout instead of limiting excursions.
  #
  # The resulting hard bound is 0.05 rad/step x 50 Hz x the 0.24 of the
  # commanded gap this arm closes per step, about 0.6 rad/s per joint.
  action_smoothing: 1.0
  response_gain: 1.0
  max_joint_step: null
  max_gripper_step: 0.01   # unused: Push-T drives joint_0..5 only
  # Sized from the network's own output in sim over 25,600 steps: mean 1.42,
  # p99.9 3.45, max 3.96. Kept equal to the PixelGoalFixed manifest so a trip
  # means the same thing in both, and so it stays well clear of a policy whose
  # own spread is wider than this one's.
  max_arm_action: 8.0
  home_seconds: 3.0
