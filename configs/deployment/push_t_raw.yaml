version: 1

# The exported policy. Its metadata carries the joint order, the default pose,
# the observation term order and the action scale, so no task ID is needed here.
#
# Under ckpts/ beside the .pt it came from, not artifacts/: it is the deployable
# form of a checkpoint rather than an analysis output. Re-export any iteration
# with vbrl-export-onnx; this one is the last of W&B run yhhr77ar --
# Mjlab-PushT-VisualSlow-DinoV2ViTS14-Afa6-TrossenRealistic, 6,000 iterations at
# gamma 0.996, carrying the object-table press penalty.
onnx_file: ckpts/push_t/dinov2_vits14_afa6_visualslow_press_5999.onnx

arm_ip: 192.168.1.2

# Where the T should end up, as a pose on the table rather than a point above
# it: (x, y, yaw) in the robot's base frame, heading in radians. `target_pose`
# also carries a z, but it never varies -- the command puts the target at the
# T's mid-height, 7 mm in the base frame -- so it is not configured here.
#
# This is a *measurement*, not a free choice, because the policy sees the goal
# twice: as these numbers, and as the marker drawn on the table in its camera
# image. They have to agree. Solve it with
#
#   python -m vbrl.deployment.goal_pose <frame.png> --margin-mm 7.0
#
# from one external-camera frame with the two tag25h9 markers seated in the
# marker's notches, then take the tags off -- the policy must never see them.
#
# These numbers came from artifacts/deployment/apriltags/, 1280x720. The same
# scene at 848x480 solved to (0.44337, 0.12683, -2.6328), so treat about a
# millimetre and half a degree as the floor on this rig.
goal_space: push_t_xy_yaw
goal: [0.44333, 0.12565, -2.6217]

# Colour exposure, pinned. Auto drove 29% of the pixels the policy saw to 255
# with a median of 253 on run1 -- a white field where all 1203 training tables
# had texture -- and it is frame-rate dependent on this camera, clipping at
# 15 fps and not at 5. 8000 us was chosen by sweeping against the training
# frames: they sit at mean 141 / median 150, and 8000 gives mean 142 / median
# 172 with nothing clipped. Clipping starts between 8000 and 11000.
# Re-sweep with `python -m vbrl.deployment.camera` if the room light changes.
camera_exposure_us: 8000

# Fixed colour exposure. Auto is what run1 used and it clipped 42% of the
# pixels the policy saw -- the tabletop was a flat white field where every one
# of the 1203 training tables carried texture. Auto is also frame-rate
# dependent on this rig: the same scene metered to 29% clipped at 15 fps and 0%
# at 5 fps, so it cannot be relied on to repeat.
#
# 7000 us is set against the training distribution rather than against "looks
# right". Sim frames under full appearance randomization sit at median 150
# (141-170) and mean 141; the probe puts this camera at median 158, mean 130,
# and 0% clipped, with clipping starting between 8000 and 11000. Matching sim's
# median alone wants 6400 and matching its mean wants 7900, so this splits them
# and keeps headroom before the sensor saturates.
#
# Re-probe after any lighting change: python -m vbrl.deployment.camera
camera_exposure_us: 7000

control_hz: 50.0        # the training decimation: 0.005 s x 4

# Raw policy: no damping of any kind, so the arm behaves as it did in training.
# Measured on 128 sim envs under exactly these settings -- episode success 0.578
# and 0.547 across two runs against 0.117 under the damped defaults, which
# rate-limit 61% of steps instead of 11%.
#
# DO NOT RUN THIS ON HARDWARE without knowing why.
#
# `max_joint_step: null` removes the rate clamp outright, so the setpoint is
# whatever the policy asked for, bounded only by the joint limits. Up to 5 rad/s
# at the action term's own 0.1 rad per 50 Hz step -- about 3x the damped profile.
# `max_arm_action` still aborts on an out-of-distribution action, but nothing
# limits speed. Measured against sim this is about 10x too fast: sim's own
# realized motion is mean 0.50 rad/s and max 2.96, because its actuator only
# closes 27% of the commanded gap per step. A real servo closes nearly all of
# it. Kept only as the reference for what 'no damping at all' means.
motion:
  action_smoothing: 1.0    # 1.0 = raw policy output, no low-pass
  max_joint_step: null     # no rate clamp at all
  max_gripper_step: 0.005  # unused: Push-T drives joint_0..5 only
  max_arm_action: 6.0
  home_seconds: 3.0
