version: 1

# W&B run u6545l3u, iteration 14999: identified arm, target-relative actions at
# 0.03, uniform goal yaw from the start. Sim: 0.876 episode success at the end
# of training, 0.78 with the mean action over 64 episodes. RealTable,
# goal-conditioned (34 inputs + camera).
onnx_file: ckpts/push_t/dinov2_vits14_afa6_realtable_g4_14999.onnx

arm_ip: 192.168.1.2

# An input: target_pose is in the observation, so these numbers and the
# marker on the table must agree. Re-solve after moving it:
#   python -m vbrl.deployment.goal_pose <frame.png> --margin-mm 7.0
goal_space: push_t_xy_yaw
goal: [0.38442, 0.01567, 0.0124]

# Re-probe before a session (python -m vbrl.deployment.camera): the real-table
# appearance was corrected on 2026-09-23, so older exposures do not carry over.
# Matched to the sim's warm table (201/143/92) with the room lights on,
# 2026-10-01: auto white balance renders the wood grey, which these policies
# never saw.
camera_exposure_us: 11000
camera_white_balance_k: 5700

control_hz: 50.0

motion:
  action_smoothing: 1.0
  max_joint_step: null
  max_gripper_step: 0.01
  max_arm_action: 8.0
  home_seconds: 3.0
