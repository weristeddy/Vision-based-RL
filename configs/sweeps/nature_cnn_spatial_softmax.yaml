project: mjlab
program: vbrl.scripts.train
name: lift_cube_rgb_real_texture_nature_cnn_spatial_softmax
method: bayes
run_cap: 10
metric: {name: Metrics/lift_height/episode_success, goal: maximize}
command:
  - ${env}
  - python
  - -m
  - ${program}
  - Mjlab-LiftCube-RealTexture-NatureCnn-SpatialSoftmax-Trossen
  - --env.scene.num-envs
  - "1024"
  - --gpu-ids
  - all
  - ${args_no_boolean_flags}

parameters:
  agent.algorithm.learning-rate: {distribution: log_uniform_values, min: 0.00030, max: 0.00045}
  agent.algorithm.num-mini-batches: {values: [8, 16]}
  agent.algorithm.desired-kl: {values: [0.010, 0.015]}
  agent.algorithm.max-grad-norm: {values: [0.5, 1.0]}
