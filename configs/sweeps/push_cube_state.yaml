project: mjlab
program: vbrl.scripts.train
name: push_cube_state_default_ppo
method: bayes
run_cap: 20
metric: {name: Metrics/push_goal/episode_success, goal: maximize}
command:
  - ${env}
  - python
  - -m
  - ${program}
  - Mjlab-PushCube-State-Trossen
  - --env.scene.num-envs
  - "1024"
  - --gpu-ids
  - all
  - ${args_no_boolean_flags}

parameters:
  agent.algorithm.learning-rate: {distribution: log_uniform_values, min: 0.0003, max: 0.001}
  agent.algorithm.num-learning-epochs: {values: [3, 5]}
  agent.algorithm.num-mini-batches: {values: [4, 8]}
  agent.algorithm.desired-kl: {values: [0.01, 0.02]}
  agent.algorithm.entropy-coef: {values: [0.002, 0.005, 0.01]}
