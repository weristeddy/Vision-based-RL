[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vbrl"
version = "0.1.0"
description = "Vision-based reinforcement learning tasks built on MJLab"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "VBRL contributors" }]

# The reproducible environment specification. Every version is exact, and
# uv.lock pins the transitive closure with hashes on top of it; rl.def installs
# from that lockfile, so the cluster image and a development host cannot drift.
# Change a version here, run `uv lock`, and rebuild rl.sif.
dependencies = [
  # Torch comes from PyTorch's cu128 index (see [tool.uv.sources] below). That
  # wheel carries sm_70/75/80/86/90/100/120, covering the V100, A100, and B200
  # clusters as well as a development workstation. Drivers stay host-provided.
  #
  # aarch64 is the Jetson AGX Thor deployment host, and it needs a different
  # build entirely: Thor's GPU is sm_110, which the cu128 wheels do not carry
  # (they stop at sm_100/sm_120), so every kernel launch there fails with
  # "no kernel image is available for execution on the device". The CUDA 13
  # wheels on the jetson-ai-lab index carry sm_110 and link JetPack's system
  # CUDA. Only the patch version differs, so the module APIs and checkpoint
  # state_dicts stay identical to what the cluster trains -- and torchvision
  # 0.24.1 is the release that pairs with torch 2.9.1.
  "torch==2.9.0; platform_machine != 'aarch64'",
  "torch==2.9.1; platform_machine == 'aarch64'",
  "torchvision==0.24.0; platform_machine != 'aarch64'",
  "torchvision==0.24.1; platform_machine == 'aarch64'",
  "torchaudio==2.9.0; platform_machine != 'aarch64'",
  "torchaudio==2.9.1; platform_machine == 'aarch64'",
  # The Jetson wheels bundle neither the ARM math libraries (NVPL supplies the
  # BLAS/LAPACK that libtorch_cpu.so links) nor cuDSS, and their metadata omits
  # both, so libtorch fails to load without them. cuDNN is pinned to the exact
  # version torch 2.9.1 was compiled against: JetPack ships 9.12, torch
  # demands 9.13, and it refuses to initialise on a minor mismatch.
  "nvpl-blas==0.6.0; platform_machine == 'aarch64'",
  "nvpl-lapack==0.4.0.1; platform_machine == 'aarch64'",
  "nvidia-cudss-cu13==0.8.0.10; platform_machine == 'aarch64'",
  "nvidia-cudnn-cu13==9.13.0.50; platform_machine == 'aarch64'",
  # Simulator, RL, and distributed launch.
  "mjlab==1.6.0",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "warp-lang==1.15.0",
  "rsl-rl-lib==5.4.2",
  "torchrunx==0.3.4",
  "tensordict==0.13.0",
  "tyro==1.0.15",
  # Viewers and logging.
  "viser==1.0.30",
  "mjviser==0.0.14",
  "wandb==0.22.3",
  # Vision backbones. R3M publishes no wheel, so it is pinned to the source
  # revision that produced the retained checkpoints (see [tool.uv.sources]).
  "transformers==4.55.2",
  "timm==1.0.19",
  "safetensors==0.6.2",
  "r3m",
  # Analysis, plotting, and asset fetching.
  "pyyaml==6.0.2",
  "pillow==12.2.0",
  "matplotlib==3.10.5",
  "seaborn==0.13.2",
  "pandas==2.3.1",
  "scikit-learn==1.7.1",
  "scipy==1.15.3",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "mediapy==1.2.7",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "gdown==6.1.0",
  # The cluster runs the suite inside rl.sif, which syncs without the dev group,
  # so pytest stays a main dependency exactly as rl.def had it.
  "pytest==8.4.1",
]

[project.optional-dependencies]
# Real-robot deployment: the Trossen arm SDK and the RealSense bindings. An
# extra rather than a dependency, because only the robot host has the hardware
# and neither the cluster image (`uv sync --frozen --no-dev`) nor a plain
# development sync should pull driver libraries it can never use. Install with
# `uv sync --extra deploy`; both ship cp312 aarch64 wheels, so the Jetson needs
# no source build.
# ONNX Runtime is deliberately absent: `bash jetson/setup.sh` installs it. The
# only build that runs on Thor is the CUDA 13 one from the jetson-ai-lab index,
# and that index stalls partway through a resolve (measured twice: 33 MB, then
# no bytes for minutes), so naming it here makes every `uv lock` hang. PyPI's
# onnxruntime-gpu is not a substitute -- it advertises CUDAExecutionProvider
# and then fails every kernel with cudaErrorNoKernelImageForDevice, because it
# carries no sm_110 image.
deploy = [
  # Pinned to the controller firmware: the driver refuses to connect unless its
  # major.minor matches, and the arm here reports 1.10.0. Upgrading the firmware
  # therefore means bumping this in lockstep.
  "trossen-arm==1.10.0",
  "pyrealsense2==2.58.4.10922",
]

[dependency-groups]
# Installed by `uv sync`; the image builds with `uv sync --no-dev`, so these
# stay out of rl.sif exactly as before.
dev = [
  "build>=1.2,<2",
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
# Consulted only for packages that name it below, so nothing else can be
# silently served from PyTorch's index.
explicit = true

[[tool.uv.index]]
name = "jetson-sbsa-cu130"
url = "https://pypi.jetson-ai-lab.io/sbsa/cu130/+simple"
# Likewise explicit. This index publishes CUDA 13 aarch64 builds for Thor and
# GB200; PyPI's own aarch64 torch wheel is CPU-only, so the marker below must
# route aarch64 here rather than letting the default index answer.
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "platform_machine != 'aarch64'" },
  { index = "jetson-sbsa-cu130", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "platform_machine != 'aarch64'" },
  { index = "jetson-sbsa-cu130", marker = "platform_machine == 'aarch64'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "platform_machine != 'aarch64'" },
  { index = "jetson-sbsa-cu130", marker = "platform_machine == 'aarch64'" },
]
r3m = { git = "https://github.com/facebookresearch/r3m.git", rev = "b2334e726887fa0206962d7984c69c5fb09cceab" }

[tool.uv]
# Lock only what VBRL is deployed on. The clusters and the development host are
# all Linux; a universal lock would resolve wheels no VBRL run ever installs.
environments = ["sys_platform == 'linux'"]

[project.scripts]
vbrl-list = "vbrl.scripts.list_registries:main"
vbrl-train = "vbrl.scripts.train:main"
vbrl-evaluate = "vbrl.scripts.evaluate:main"
vbrl-analyze = "vbrl.scripts.analyze:main"
vbrl-visualize = "vbrl.scripts.play:main"
vbrl-fetch-backbones = "vbrl.scripts.fetch_backbones:main"
vbrl-deploy = "vbrl.scripts.deploy:main"
vbrl-export-onnx = "vbrl.scripts.export_onnx:main"

[project.entry-points."mjlab.tasks"]
vbrl = "vbrl.tasks"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["vbrl*"]

[tool.setuptools.package-data]
vbrl = [
  "**/*.json",
  "**/*.md",
  "**/*.obj",
  "**/*.png",
  "**/*.stl",
  "**/*.xml",
  "**/*.yaml",
  "**/*.yml",
  "**/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "sim: requires constructing or stepping a simulator environment",
  "gpu: requires a CUDA-capable GPU",
  "integrity: verifies repository artifacts or preserved behavior contracts",
  "live: requires explicit credentials, network access, and external services",
]

[tool.ruff]
target-version = "py310"
line-length = 88
# The mjlab family uses two-space Python indentation; ruff's default of four
# would make `ruff format` rewrite the entire tree.
indent-width = 2
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["vbrl"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["vbrl"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
